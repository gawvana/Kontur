server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org" always;
  location /api/ { proxy_pass http://api:8000; }
  location = /index.html { expires -1; }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
