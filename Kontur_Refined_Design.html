const $=s=>document.querySelector(s);const icon=(n)=>`<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[{id:1,name:'Александр',username:'demo_alex',initials:'АЛ',color:'blue',positive:12,negative:1,verified:true,status:'Есть отзывы',category:'Дизайн и разработка',review:'Заказал оформление канала. Работа выполнена в согласованный срок, исходники получены.',negativeText:'Срок передачи второго заказа был нарушен. Позже стороны сообщили о возврате оплаты.'},{id:2,name:'Мария',username:'demo_maria',initials:'МА',color:'lilac',positive:8,negative:0,verified:true,status:'Есть отзывы',category:'Иллюстрации',review:'Получил иллюстрации и исходные файлы. Всё соответствует согласованному заданию.'},{id:3,name:'Денис',username:'demo_denis',initials:'ДЕ',color:'sand',positive:2,negative:3,verified:false,status:'Есть отзывы',category:'Цифровые товары',review:'Материалы были переданы после подтверждения оплаты.',negativeText:'Передача материалов задержалась. Опубликованы описание взаимодействия и ответ второй стороны.'},{id:4,name:'София',username:'demo_sofia',initials:'СО',color:'mint',positive:0,negative:0,verified:false,status:'Нет отзывов',category:'Сохранённый контакт'}];
const initial={theme:'system',catalogs:[{id:'work',name:'Рабочие контакты',desc:'Проекты, услуги, сотрудничество',shared:false,ids:[1,2],color:'blue'},{id:'deals',name:'Перед сделкой',desc:'Контакты, которые хочу проверить',shared:false,ids:[3,4],color:'lilac'},{id:'team',name:'Команда',desc:'Общий каталог для проекта',shared:true,ids:[1,2,4],color:'mint'}],notes:{1:'Обсудить новый проект в понедельник.',2:'Хороший стиль иллюстраций. Сохранить референсы.',3:'Уточнить условия и сроки до оплаты.'},cases:[{id:'2048',person:3,title:'Задержка передачи материалов',status:'На рассмотрении',type:'pending',date:'Сегодня, 10:24',desc:'Материалы переданы модератору. Ожидается ответ второй стороны.',positive:false},{id:'2031',person:2,title:'Иллюстрации для проекта',status:'Опубликовано',type:'positive',date:'Вчера, 16:40',desc:'Положительный опыт опубликован после проверки материалов.',positive:true},{id:'2014',person:1,title:'Разработка страницы',status:'Нужны сведения',type:'pending',date:'28 сентября',desc:'Добавьте согласованный срок выполнения заказа.',positive:false}],subscriptions:[],notifications:true};
let state;try{const current=JSON.parse(localStorage.getItem('kontur-design-v4'));const previous=JSON.parse(localStorage.getItem('kontup-signal-v3'));state=current||(previous?{...previous,theme:'system'}:structuredClone(initial))}catch{state=structuredClone(initial)}
if(!Array.isArray(state.catalogs)||!Array.isArray(state.cases)){state=structuredClone(initial)}
let page='check',filter='all',query='',folder=null,reviewDraft={person:1,positive:false,text:'',files:[]},lastFocus=null,toastTimer;
const save=()=>{try{localStorage.setItem('kontur-design-v4',JSON.stringify(state))}catch{}};
const avatar=(p,large=false)=>`<div class="avatar ${p.color} ${large?'large':''}" aria-hidden="true">${esc(p.initials)}</div>`;
function theme(){const dark=state.theme==='dark'||(state.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.body.classList.toggle('dark',dark);document.documentElement.style.backgroundColor=dark?'#101015':'#ded8e6';$('#theme-top').innerHTML=icon(dark?'sun':'moon');$('meta[name="theme-color"]').content=dark?'#101015':'#ded8e6'}
function toast(t){clearTimeout(toastTimer);$('#toast').innerHTML=icon('check')+'<span>'+esc(t)+'</span>';$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3300)}
function navigation(){const items=[['check','search','Проверка'],['catalogs','folder','Каталоги'],['cases','cases','Обращения'],['profile','user','Профиль']];const dock=$('#mobile-nav');if(!dock.querySelector('.dock-lens'))dock.innerHTML='<i class="dock-lens" aria-hidden="true"></i>'+items.map(([id,i,t])=>`<button data-page="${id}"><svg aria-hidden="true"><g class="nav-icon-rest"><use href="#i-${i}"/></g><g class="nav-icon-active"><use href="#i-${i}-active"/></g></svg><span>${t}</span></button>`).join('');dock.style.setProperty('--i',items.findIndex(x=>x[0]===page));dock.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#crumb-title').textContent=items.find(x=>x[0]===page)[2]}
function navigate(p){$('#chrome').classList.remove('min');page=p;folder=null;query='';filter='all';render();window.scrollTo({top:0,behavior:'instant'})}
function counts(p){return p.positive+p.negative?`<span class="review-num good">${icon('plus')}${p.positive} полож.</span><span class="review-num bad">${icon('minus')}${p.negative} отриц.</span>`:`<span class="review-num muted">Недостаточно данных</span>`}
function personRow(p,notes=false){return `<button class="person-row" data-action="person" data-id="${p.id}">${avatar(p)}<div class="grow"><div class="person-name">${esc(p.name)}${p.verified?icon('verified'):''}</div><div class="username">@${p.username}</div><div class="reviews-mini">${counts(p)}</div></div><div class="row-right"><span class="pill ${p.positive+p.negative?'neutral':'info'}">${p.status}</span>${icon('chevron')}</div></button>${notes&&state.notes[p.id]?`<div class="note-surface">${icon('lock').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px;margin-right:4px"')} ${esc(state.notes[p.id])}</div>`:''}`}
function results(){const q=query.trim().toLowerCase().replace(/^@/,'');const saved=new Set(state.catalogs.flatMap(f=>f.ids));const list=people.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.username.includes(q))&&(filter!=='reviews'||p.positive+p.negative>0)&&(filter!=='mine'||saved.has(p.id)));return list.length?list.map(p=>personRow(p)).join(''):`<div class="empty">${icon('search')}<h3>Контакт не найден</h3><p>В демо доступны Александр, Мария, Денис и София.</p><button class="link-button" data-action="reset-search">Показать все контакты</button></div>`}
function checkPage(){return `<div class="content-grid"><section><div class="hero"><div class="hero-top"><span class="eyebrow">Перед взаимодействием</span><span class="hero-chip">${icon('spark').replace('<svg','<svg style="width:11px;height:11px"')} Ваши заметки приватны</span></div><h1>Проверка контакта</h1><p>Найдите контакт и посмотрите опубликованный опыт.</p><div class="hero-tags"><span>Опыт + / −</span><span>Личный архив</span><span>Ответ и апелляция</span></div><div class="hero-decoration" aria-hidden="true">${icon('flower')}</div></div><form id="search-form" role="search"><div class="search-wrap">${icon('search')}<input id="search-input" aria-label="Поиск контакта" placeholder="Проверить @username" value="${esc(query)}" autocomplete="off" spellcheck="false"><button class="search-go" aria-label="Найти контакт">${icon('arrow')}</button></div></form><div class="search-caption">${icon('lock')} Ваши заметки остаются только у вас</div><div class="chips" aria-label="Фильтр контактов">${[['all','Все'],['reviews','С отзывами'],['mine','Мои контакты']].map(([id,t])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${t}</button>`).join('')}</div><div class="flex between section-heading"><h3 id="results-title">${query?'Результаты':'Контакты'}</h3><span class="badge-demo">Вымышленные данные</span></div><div class="result-list" id="search-results">${results()}</div><div class="sub-section"><div class="flex between section-heading"><h3>Ваши каталоги</h3><button class="link-button" data-page="catalogs">Все ${icon('arrow').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-3px;margin-left:4px"')}</button></div><div class="mini-folder-grid">${state.catalogs.slice(0,2).map(f=>`<button class="folder-preview" data-action="folder" data-id="${esc(f.id)}"><div class="folder-icon">${icon('folder')}</div><h3>${esc(f.name)}</h3><div class="stat-line"><span>${f.ids.length} контакта</span>${icon('lock').replace('<svg','<svg style="width:12px;height:12px"')}</div></button>`).join('')}</div></div><div class="principles"><div class="setting-icon">${icon('people')}</div><div class="grow"><h3>У истории есть две стороны</h3><p>Опубликованный опыт, ответ и решение отображаются отдельно. Плюсы не скрывают минусы.</p><button class="link-button" data-action="rules">Как работает репутация ${icon('arrow').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-3px;margin-left:4px"')}</button></div></div><p class="smallprint">Отсутствие отрицательных отзывов не гарантирует безопасность.<br>Контур / Дизайн-прототип · Данные вымышлены.</p></section></div>`}
function catalogPage(){if(folder){const f=state.catalogs.find(x=>x.id===folder);if(!f){folder=null;return catalogPage()}return `<button class="backlink" data-action="back-catalogs">${icon('back')} Все каталоги</button><div class="page-heading"><div><h1>${esc(f.name)}</h1><p class="page-subtitle">${esc(f.desc)} · ${f.shared?'Совместный каталог':'Только вы'}</p></div><button class="icon-button" data-action="folder-info" data-id="${esc(f.id)}" aria-label="Сведения о каталоге">${icon(f.shared?'people':'lock')}</button></div><div class="notice">${icon('lock')}<span>${f.shared?'В этом каталоге участники видят только явно добавленные сюда сведения.':'Заметки и контакты в этом каталоге видны только вам.'}</span></div><div class="result-list">${f.ids.length?f.ids.map(id=>personRow(people.find(p=>p.id===id),!f.shared)).join(''):`<div class="empty">${icon('folder')}<h3>Пока нет контактов</h3><p>Найдите контакт и сохраните его в этот каталог.</p><button class="link-button" data-page="check">Найти контакт</button></div>`}</div><button class="secondary wide" style="margin-top:20px" data-page="check">${icon('plus')} Найти и добавить контакт</button>`}return `<div class="page-heading"><div><span class="eyebrow">Ваше пространство</span><h1 style="margin-top:8px">Каталоги</h1><p class="page-subtitle">Контакты и контекст, которые нужны вам.</p></div><button class="primary" data-action="new-folder">${icon('plus')} Создать</button></div><div class="folder-grid">${state.catalogs.map(f=>`<button class="catalog-card" data-action="folder" data-id="${esc(f.id)}"><div class="flex between"><div class="folder-icon ${f.color==='lilac'?'lilac':''}" style="margin:0">${icon('folder')}</div><span class="pill neutral">${icon(f.shared?'people':'lock')}${f.shared?'Общий':'Личный'}</span></div><h3>${esc(f.name)}</h3><p class="muted" style="font-size:12px;min-height:36px">${esc(f.desc)}</p><div class="catalog-avatars">${f.ids.slice(0,4).map(id=>avatar(people.find(p=>p.id===id))).join('')||'<span class="muted" style="font-size:11px">Добавьте первый контакт</span>'}</div><div class="stat-line"><span>${f.ids.length} контакта</span>${icon('chevron').replace('<svg','<svg style="width:15px;height:15px"')}</div></button>`).join('')}</div><div class="notice">${icon('lock')}<span>Личная заметка не становится публичным отзывом. Вы сами выбираете, что сохранять и с кем делиться.</span></div>`}
function casesPage(){return `<div class="page-heading"><div><span class="eyebrow">Прозрачное рассмотрение</span><h1 style="margin-top:8px">Обращения</h1><p class="page-subtitle">Ваш опыт, материалы и история решений.</p></div><button class="primary" data-action="new-review">${icon('plus')} Добавить</button></div><div class="cases-list">${state.cases.map(c=>`<button class="case-card" data-action="case" data-id="${esc(c.id)}"><div class="flex between"><span class="pill ${c.type}">${icon(c.type==='positive'?'check':'clock')}${esc(c.status)}</span><small class="muted">№ ${esc(c.id)}</small></div><h3>${esc(c.title)}</h3><div class="case-meta"><span>@${people.find(p=>p.id===c.person)?.username||'demo'}</span><span>${esc(c.date)}</span></div><div class="case-foot"><span>${c.type==='positive'?'Решение и опубликованная версия':'История и следующий шаг'}</span>${icon('chevron').replace('<svg','<svg style="width:15px;height:15px"')}</div></button>`).join('')}</div><p class="smallprint">Положительный и отрицательный опыт проходят одинаковую проверку.</p>`}
function profilePage(){return `<div class="profile-layout"><div class="page-heading"><div><span class="eyebrow">Всё под вашим контролем</span><h1 style="margin-top:8px">Профиль</h1></div></div><div class="card profile-head"><div class="avatar blue large">Г</div><div><h2>Геко</h2><p class="muted" style="font-size:13px">@demo_geko</p><span class="pill info" style="margin-top:9px">${icon('verified')} Доступ к аккаунту подтверждён</span></div></div><div class="settings-title">Интерфейс</div><div class="card settings-group" style="margin-top:0"><button class="setting-row" data-action="theme-settings"><span class="setting-icon">${icon('moon')}</span><span>Оформление</span><span class="value">${{system:'Системное',light:'Светлое',dark:'Тёмное'}[state.theme]}</span>${icon('chevron')}</button><button class="setting-row" data-action="notification-settings"><span class="setting-icon">${icon('bell')}</span><span>Уведомления</span><span class="toggle ${state.notifications?'on':''}" aria-hidden="true"></span></button><button class="setting-row" data-action="saved-subs"><span class="setting-icon">${icon('user')}</span><span>Мои подписки</span><span class="value">${state.subscriptions.length}</span>${icon('chevron')}</button></div><div class="settings-title">Приватность и помощь</div><div class="card settings-group" style="margin-top:0"><button class="setting-row" data-action="privacy"><span class="setting-icon">${icon('lock')}</span><span>Приватность данных</span><span class="value">Личные по умолчанию</span>${icon('chevron')}</button><button class="setting-row" data-action="rules"><span class="setting-icon">${icon('file')}</span><span>Правила репутации</span>${icon('chevron').replace('<svg','<svg style="margin-left:auto"')}</button><button class="setting-row" data-action="reset-demo"><span class="setting-icon">${icon('help')}</span><span>Сбросить демо</span>${icon('chevron').replace('<svg','<svg style="margin-left:auto"')}</button></div><p class="smallprint">Контур · дизайн-концепт 04<br>Данные сохраняются только в этом браузере. Сервер не подключён.</p></div>`}
function render(){navigation();$('#app').innerHTML=`<div class="page">${{check:checkPage,catalogs:catalogPage,cases:casesPage,profile:profilePage}[page]()}</div>`;theme()}
function modal(html){lastFocus=document.activeElement;document.body.classList.add('sheet-open');$('#modal-body').innerHTML=html;if(!$('#modal').open){setSheetExpanded(false);$('#modal').showModal()}$('#modal-body').scrollTop=0;animateContent($('#modal-body'))}
function close(){document.body.classList.remove('sheet-open');$('#modal').style.transform='';if($('#modal').open)$('#modal').close();if(lastFocus?.isConnected)lastFocus.focus()}
function showPerson(id){const p=people.find(x=>x.id===Number(id));if(!p)return;modal(`<div class="subject-head">${avatar(p,true)}<h2 id="modal-title">${esc(p.name)}</h2><p>@${p.username}</p>${p.verified?`<span class="pill info">${icon('verified')} Доступ к аккаунту подтверждён</span>`:`<span class="pill neutral">Аккаунт в демонстрационных данных</span>`}</div><div class="review-totals"><div class="total-box positive"><strong>+${p.positive}</strong><small>Положительный опыт</small></div><div class="total-box negative"><strong>−${p.negative}</strong><small>Отрицательный опыт</small></div></div><p class="subtle-disclaimer">Все сведения вымышлены и приведены для просмотра дизайна. Подтверждение аккаунта и число отзывов не гарантируют безопасность.</p><div class="flex"><button class="primary grow" data-action="save-person" data-id="${p.id}">${icon('folder')} Сохранить</button><button class="icon-button" data-action="subscribe" data-id="${p.id}" aria-label="${state.subscriptions.includes(p.id)?'Отписаться':'Подписаться'}" aria-pressed="${state.subscriptions.includes(p.id)}" style="color:${state.subscriptions.includes(p.id)?'var(--blue)':'var(--muted)'}">${icon('bell')}</button></div><div class="modal-section-title"><h3>Опубликованный опыт</h3><small class="muted">Примеры</small></div>${p.positive?`<div class="review-card"><div class="flex between"><span class="pill positive">${icon('plus')} Положительный</span><small>18 сентября</small></div><p>${esc(p.review)}</p><div class="review-files"><button class="file-chip" data-action="evidence">${icon('image')} Материалы · 2</button><span class="file-chip">${icon('check')} Проверена версия</span></div><small style="display:block;margin-top:11px">Автор 01 · ${esc(p.category)}</small></div>`:''}${p.negative?`<div class="review-card"><div class="flex between"><span class="pill negative">${icon('minus')} Отрицательный</span><small>12 сентября</small></div><p>${esc(p.negativeText)}</p>${p.id===1?'<span class="pill neutral">Стороны сообщили о возврате</span>':'<span class="pill neutral">Ответ второй стороны опубликован</span>'}<div style="margin-top:11px"><button class="file-chip" data-action="evidence">${icon('file')} Материалы и решение</button></div></div>`:''}${!p.positive&&!p.negative?'<div class="empty"><h3>Пока нет опубликованного опыта</h3><p>Это не оценка надёжности контакта.</p></div>':''}<button class="secondary wide" style="margin-top:12px" data-action="new-review" data-id="${p.id}">${icon('plus')} Описать свой опыт</button><div class="modal-section-title"><h3>Личная заметка</h3><span class="pill neutral">${icon('lock')} Только вы</span></div><p class="muted" style="font-size:13px;line-height:1.7">${esc(state.notes[p.id]||'Добавьте важные детали для себя.')}</p><button class="link-button" data-action="edit-note" data-id="${p.id}">${icon('edit').replace('<svg','<svg style="width:14px;height:14px;vertical-align:-3px;margin-right:5px"')} Изменить заметку</button>`)}
function newFolder(){modal(`<h2 id="modal-title">Новый каталог</h2><p class="page-subtitle">Отдельное место для важных контактов.</p><form id="folder-form"><div class="form-row"><label for="folder-name">Название</label><input class="form-input" id="folder-name" required maxlength="50" placeholder="Например, Фриланс"></div><div class="form-row"><label for="folder-description">Описание</label><input class="form-input" id="folder-description" maxlength="100" placeholder="Для чего этот каталог"></div><div class="notice">${icon('lock')} Каталог будет личным. Заметки видны только вам.</div><button class="primary wide">Создать каталог</button></form>`)}
function savePerson(id){modal(`<h2 id="modal-title">Сохранить контакт</h2><p class="page-subtitle">Выберите личный каталог.</p><div class="stack" style="margin-top:22px">${state.catalogs.filter(f=>!f.shared).map(f=>`<button class="setting-row card" data-action="confirm-save" data-person="${id}" data-id="${esc(f.id)}"><span class="setting-icon">${icon('folder')}</span><span>${esc(f.name)}</span>${icon(f.ids.includes(Number(id))?'check':'plus').replace('<svg','<svg style="margin-left:auto;color:var(--blue)"')}</button>`).join('')}</div><button class="quiet wide" style="margin-top:13px" data-action="new-folder">Создать новый каталог</button>`)}
function editNote(id){modal(`<h2 id="modal-title">Личная заметка</h2><p class="page-subtitle">@${people.find(p=>p.id===Number(id)).username} · Только вы</p><form id="note-form" data-id="${id}"><div class="form-row"><label for="note-text">Ваш контекст</label><textarea class="form-input" id="note-text" maxlength="2000" placeholder="Условия, сроки, важные детали…">${esc(state.notes[id]||'')}</textarea></div><button class="primary wide">Сохранить заметку</button></form>`)}
function reviewStep(step=1){reviewDraft.step=step;const p=people.find(x=>x.id===Number(reviewDraft.person));const top=`<h2 id="modal-title">Ваш опыт</h2><p class="page-subtitle">Шаг ${step} из 3 · ${['','Контакт и описание','Материалы','Проверка перед отправкой'][step]}</p><div class="stepper" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=step?'active':''}"></i>`).join('')}</div>`;if(step===1){modal(`${top}<form id="review-form"><div class="form-row"><label for="review-person">Контакт</label><select class="form-input" id="review-person">${people.map(p=>`<option value="${p.id}" ${p.id===Number(reviewDraft.person)?'selected':''}>${esc(p.name)} · @${p.username}</option>`).join('')}</select></div><div class="field-label">Как прошло взаимодействие?</div><div class="segmented"><button type="button" class="${reviewDraft.positive?'active':''}" data-action="review-sign" data-sign="positive">Положительный опыт</button><button type="button" class="${!reviewDraft.positive?'active':''}" data-action="review-sign" data-sign="negative">Отрицательный опыт</button></div><div class="form-row"><label for="review-text">Что произошло?</label><textarea id="review-text" class="form-input" required minlength="20" maxlength="3000" placeholder="Что согласовали, когда и какой результат получили…">${esc(reviewDraft.text)}</textarea><small class="muted">Минимум 20 символов. Опишите конкретное взаимодействие.</small></div><button class="primary wide">Продолжить ${icon('arrow')}</button></form>`)}else if(step===2){modal(`${top}<p class="muted" style="font-size:13px">Добавьте материалы, которые подтверждают описанное. В прототипе сохраняются только названия файлов.</p><label class="upload-box" for="evidence-input">${icon('upload')}<b style="color:var(--ink)">Выбрать материалы</b><span>Изображения, PDF, видео или аудио</span></label><input type="file" id="evidence-input" multiple accept="image/*,application/pdf,video/*,audio/*" class="hidden"><div id="selected-files">${fileNames()}</div><div class="notice">${icon('lock')} Оригиналы не становятся публичными автоматически. Перед публикацией скрываются личные данные.</div><div class="form-actions"><button class="secondary" data-action="review-back" data-step="1">Назад</button><button class="primary" data-action="review-next">Предпросмотр ${icon('arrow')}</button></div>`)}else{modal(`${top}<div class="review-card"><div class="flex between"><b>@${p.username}</b><span class="pill ${reviewDraft.positive?'positive':'negative'}">${reviewDraft.positive?'Положительный':'Отрицательный'}</span></div><p>${esc(reviewDraft.text)}</p><div class="review-files">${reviewDraft.files.map(n=>`<span class="file-chip">${icon('file')}${esc(n)}</span>`).join('')||'<small>Материалы не выбраны</small>'}</div></div><form id="review-submit"><label class="checkbox"><input type="checkbox" required><span>Это описание моего взаимодействия. Я понимаю, что публикация возможна только после модерации.</span></label><div class="form-actions"><button class="secondary" type="button" data-action="review-back" data-step="2">Назад</button><button class="primary">Отправить на проверку</button></div></form><p class="subtle-disclaimer">Демо: обращение появится в вашем списке. Отправки на сервер нет.</p>`)}}
function fileNames(){return reviewDraft.files.map(n=>`<div class="file-chip" style="margin:3px">${icon('file')}${esc(n)}</div>`).join('')}
function showCase(id){const c=state.cases.find(x=>x.id===id);modal(`<span class="pill ${c.type}">${icon(c.type==='positive'?'check':'clock')}${esc(c.status)}</span><h2 id="modal-title" style="margin-top:16px">${esc(c.title)}</h2><p class="page-subtitle">№ ${esc(c.id)} · @${people.find(p=>p.id===c.person)?.username}</p><div class="review-card" style="margin-top:22px"><p style="margin:0">${esc(c.desc)}</p></div><div class="modal-section-title"><h3>История обращения</h3></div><div class="timeline"><div class="timeline-item"><div class="timeline-dot"></div><div><p>Обращение создано</p><small>${esc(c.date)}</small></div></div><div class="timeline-item"><div class="timeline-dot"></div><div><p>Материалы приняты</p><small>Оригиналы доступны участникам рассмотрения</small></div></div><div class="timeline-item"><div class="timeline-dot" style="background:${c.type==='positive'?'var(--green)':'var(--amber)'}"></div><div><p>${esc(c.status)}</p><small>${c.type==='positive'?'Проверенная версия появилась в карточке':'Следующее событие появится здесь'}</small></div></div></div><button class="secondary wide" data-action="case-add" data-id="${esc(c.id)}">${icon('plus')} Дополнить обращение</button>${c.type==='positive'?`<button class="quiet wide" data-action="appeal" data-id="${esc(c.id)}">Обжаловать решение</button>`:''}`)}
function simpleForm(kind,id){const appeal=kind==='appeal';modal(`<h2 id="modal-title">${appeal?'Апелляция':'Дополнение'}</h2><p class="page-subtitle">Обращение № ${esc(id)}</p><form id="case-update-form" data-id="${esc(id)}" data-kind="${kind}"><div class="form-row"><label for="case-update-text">${appeal?'Что нужно пересмотреть и почему?':'Новые сведения'}</label><textarea class="form-input" id="case-update-text" required minlength="20" maxlength="2000" placeholder="Опишите конкретные обстоятельства…"></textarea></div><p class="muted" style="font-size:12px">${appeal?'Апелляцию рассматривает другой сотрудник. В прототипе показано только изменение состояния.':'Дополнение сохраняется в истории обращения. Демо работает в вашем браузере.'}</p><button class="primary wide" style="margin-top:20px">Отправить</button></form>`)}
function rules(){modal(`<h2 id="modal-title">Опыт важнее ярлыков</h2><p class="page-subtitle">Четыре правила, которые видны в интерфейсе.</p><div class="stack" style="margin-top:23px">${[['file','Конкретное взаимодействие','Отзыв описывает вашу сделку или совместную работу. Материалы помогают проверить контекст.'],['plus','Плюсы и минусы отдельно','Положительный опыт не скрывает опубликованные отрицательные случаи.'],['people','Ответ и апелляция','Вторая сторона может ответить, дополнить сведения и обжаловать решение.'],['lock','Личное остаётся личным','Каталоги и заметки не публикуются вместе с отзывом.']].map(([i,t,d])=>`<div class="flex" style="align-items:start"><div class="setting-icon">${icon(i)}</div><div><h3 style="font-size:14px">${t}</h3><p class="muted" style="font-size:12px;margin-top:5px;line-height:1.7">${d}</p></div></div>`).join('')}</div><button class="primary wide" style="margin-top:25px" data-action="close">Понятно</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action,id=b.dataset.id;if(!a)return;switch(a){case'sheet-toggle':setSheetExpanded(!$('#modal').classList.contains('expanded'));break;case'create-menu':modal(`<h2 id="modal-title">Добавить в Контур</h2><p class="page-subtitle">Сохранить для себя или описать свой опыт.</p><div class="stack" style="margin-top:23px"><button class="setting-row card" data-action="new-folder"><span class="setting-icon">${icon('folder')}</span><span class="grow">Личный каталог</span>${icon('chevron')}</button><button class="setting-row card" data-action="new-review"><span class="setting-icon">${icon('edit')}</span><span class="grow">Опыт взаимодействия</span>${icon('chevron')}</button><button class="setting-row card" data-action="find-contact"><span class="setting-icon">${icon('search')}</span><span class="grow">Найти контакт</span>${icon('chevron')}</button></div>`);break;case'find-contact':close();navigate('check');$('#search-input').focus();break;case'close':close();break;case'theme':state.theme=document.body.classList.contains('dark')?'light':'dark';save();theme();if(page==='profile')render();break;case'person':showPerson(id);break;case'reset-search':query='';render();break;case'folder':page='catalogs';folder=id;render();window.scrollTo(0,0);break;case'back-catalogs':folder=null;render();break;case'new-folder':newFolder();break;case'save-person':savePerson(id);break;case'confirm-save':{const f=state.catalogs.find(x=>x.id===id),pid=Number(b.dataset.person);if(!f.ids.includes(pid))f.ids.push(pid);save();close();render();toast('Контакт сохранён в каталоге');break}case'edit-note':editNote(id);break;case'subscribe':{const pid=Number(id),idx=state.subscriptions.indexOf(pid);idx<0?state.subscriptions.push(pid):state.subscriptions.splice(idx,1);save();showPerson(pid);toast(idx<0?'Подписка добавлена':'Подписка удалена');break}case'new-review':reviewDraft={person:Number(id)||1,positive:false,text:'',files:[]};reviewStep();break;case'review-sign':reviewDraft.person=Number($('#review-person').value);reviewDraft.text=$('#review-text').value;reviewDraft.positive=b.dataset.sign==='positive';reviewStep();break;case'review-back':reviewStep(Number(b.dataset.step));break;case'review-next':reviewStep(3);break;case'case':showCase(id);break;case'case-add':simpleForm('addition',id);break;case'appeal':simpleForm('appeal',id);break;case'rules':rules();break;case'evidence':modal(`<h2 id="modal-title">Материалы к отзыву</h2><p class="page-subtitle">Пример безопасной публичной копии.</p><div class="review-card"><span class="file-chip">${icon('image')} Фрагмент переписки · демо</span><div style="padding:20px 0"><div style="background:var(--surface);padding:13px;border-radius:12px;font-size:13px;max-width:88%;margin-bottom:12px">Согласовали передачу исходников до пятницы.</div><div style="background:var(--blue-soft);padding:13px;border-radius:12px;font-size:13px;max-width:88%;margin-left:auto">Подтверждаю. Материалы передам в согласованный срок.</div></div><p class="muted" style="font-size:11px;margin:0">Это вымышленная переписка. В реальном сервисе личные данные скрываются в производной копии.</p></div><button class="primary wide" data-action="close">Закрыть</button>`);break;case'notifications':modal(`<h2 id="modal-title">Уведомления</h2><p class="page-subtitle">Изменения, которые важны вам.</p><div style="margin-top:17px">${state.cases.slice(0,3).map(c=>`<button class="setting-row" data-action="case" data-id="${esc(c.id)}"><span class="setting-icon">${icon(c.type==='positive'?'check':'clock')}</span><div class="grow"><b style="font-size:13px">${esc(c.status)}</b><div class="muted" style="font-size:11px;margin-top:3px">№ ${esc(c.id)} · ${esc(c.title)}</div></div>${icon('chevron')}</button>`).join('')}</div>`);break;case'theme-settings':modal(`<h2 id="modal-title">Оформление</h2><p class="page-subtitle">Одинаково спокойно в любой теме.</p><div class="stack" style="margin-top:23px">${[['system','Как на устройстве'],['light','Светлое'],['dark','Тёмное']].map(([v,t])=>`<button class="setting-row card" data-action="choose-theme" data-value="${v}">${icon(v==='dark'?'moon':'sun')}<span class="grow">${t}</span>${state.theme===v?icon('check'):''}</button>`).join('')}</div>`);break;case'choose-theme':state.theme=b.dataset.value;save();theme();close();render();break;case'notification-settings':state.notifications=!state.notifications;save();render();toast(state.notifications?'Демо-уведомления включены':'Демо-уведомления выключены');break;case'saved-subs':modal(`<h2 id="modal-title">Мои подписки</h2><p class="page-subtitle">Только изменения опубликованных карточек.</p><div class="result-list" style="margin-top:22px">${state.subscriptions.length?state.subscriptions.map(id=>personRow(people.find(p=>p.id===id))).join(''):'<div class="empty"><h3>Пока нет подписок</h3><p>Нажмите на колокольчик в карточке контакта.</p></div>'}</div>`);break;case'privacy':modal(`<h2 id="modal-title">Ваши данные</h2><div class="notice">${icon('lock')} Этот HTML-прототип не отправляет данные на сервер.</div><p class="muted" style="font-size:13px;line-height:1.8">Созданные каталоги, заметки, обращения и выбранная тема сохраняются только в хранилище вашего браузера. Для файлов запоминается только название. Все исходные аккаунты и отзывы вымышлены.</p><button class="secondary wide" style="margin-top:24px" data-action="export-demo">${icon('file')} Скачать мои демо-данные</button>`);break;case'export-demo':{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='kontur-demo-data.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Демо-данные экспортированы');break}case'reset-demo':modal(`<h2 id="modal-title">Сбросить демо?</h2><p class="page-subtitle">Созданные в этом браузере заметки, каталоги и обращения будут удалены.</p><div class="form-actions"><button class="secondary" data-action="close">Отмена</button><button class="primary" data-action="confirm-reset">Сбросить</button></div>`);break;case'confirm-reset':state=structuredClone(initial);save();close();render();toast('Исходный макет восстановлен');break;case'folder-info':{const f=state.catalogs.find(x=>x.id===id);modal(`<h2 id="modal-title">${esc(f.name)}</h2><p class="page-subtitle">${f.shared?'Совместный каталог · 3 участника':'Личный каталог · Только вы'}</p>${f.shared?`<div class="stack" style="margin-top:23px">${[['Геко','Владелец'],['Мария','Редактор'],['Александр','Просмотр']].map(([n,r])=>`<div class="flex between"><b style="font-size:13px">${n}</b><span class="pill neutral">${r}</span></div>`).join('')}</div>`:`<div class="notice">${icon('lock')} Контакты и заметки в этом каталоге приватны.</div>`}<p class="subtle-disclaimer">${f.shared?'Список участников показан для оценки дизайна. Серверное управление доступами в прототип не подключено.':'Каталог сохраняется только в текущем браузере.'}</p>`);break}}});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){query=e.target.value;$('#search-results').innerHTML=results();if($('#results-title'))$('#results-title').textContent=query?'Результаты':'Контакты';}});
document.addEventListener('change',e=>{if(e.target.id==='evidence-input'){reviewDraft.files=Array.from(e.target.files).slice(0,20).map(f=>f.name);$('#selected-files').innerHTML=fileNames();}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;if(form.id==='search-form'){$('#search-input').blur();toast(query?'Показаны совпадения в демо':'Введите имя или @username')}else if(form.id==='folder-form'){const name=$('#folder-name').value.trim();if(!name)return;state.catalogs.push({id:'folder-'+Date.now(),name,desc:$('#folder-description').value.trim()||'Личный каталог',shared:false,ids:[],color:'blue'});save();close();navigate('catalogs');toast('Каталог создан')}else if(form.id==='note-form'){state.notes[form.dataset.id]=$('#note-text').value.trim();save();close();render();toast('Личная заметка сохранена')}else if(form.id==='review-form'){reviewDraft.person=Number($('#review-person').value);reviewDraft.text=$('#review-text').value.trim();if(reviewDraft.text.length<20){toast('Опишите опыт подробнее: минимум 20 символов');return}reviewStep(2)}else if(form.id==='review-submit'){state.cases.unshift({id:String(Date.now()).slice(-6),person:reviewDraft.person,title:reviewDraft.positive?'Положительный опыт взаимодействия':'Описание взаимодействия',status:'На рассмотрении',type:'pending',date:'Только что',desc:reviewDraft.text,positive:reviewDraft.positive,files:reviewDraft.files});save();close();navigate('cases');toast('Демо-обращение добавлено в ваш список')}else if(form.id==='case-update-form'){const c=state.cases.find(x=>x.id===form.dataset.id),text=$('#case-update-text').value.trim();if(text.length<20){toast('Добавьте минимум 20 символов');return}c.desc+='\n\n'+(form.dataset.kind==='appeal'?'Апелляция: ':'Дополнение: ')+text;if(form.dataset.kind==='appeal'){c.status='На пересмотре';c.type='pending'}save();close();render();toast(form.dataset.kind==='appeal'?'Демо-апелляция добавлена':'Дополнение сохранено')}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close()}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(state.theme==='system')theme()});
$('#modal').addEventListener('close',()=>document.body.classList.remove('sheet-open'));
$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});
let dockDrag=null;
const dock=$('#mobile-nav'),dockPages=['check','catalogs','cases','profile'];
dock.addEventListener('pointerdown',e=>{if(e.button!==0)return;$('#chrome').classList.remove('min');dockDrag={id:e.pointerId,start:e.clientX,moved:false};});
dock.addEventListener('pointermove',e=>{if(!dockDrag||dockDrag.id!==e.pointerId)return;if(Math.abs(e.clientX-dockDrag.start)>7){dockDrag.moved=true;dock.classList.add('dragging');if(!dock.hasPointerCapture(e.pointerId))dock.setPointerCapture(e.pointerId);const r=dock.getBoundingClientRect();dock.style.setProperty('--i',Math.max(0,Math.min(3,Math.floor((e.clientX-r.left-8)/((r.width-16)/4)))));}});
dock.addEventListener('pointerup',e=>{if(!dockDrag)return;const changed=dockDrag.moved;dockDrag=null;dock.classList.remove('dragging');if(changed){const r=dock.getBoundingClientRect();navigate(dockPages[Math.max(0,Math.min(3,Math.floor((e.clientX-r.left-8)/((r.width-16)/4))))]);}});
dock.addEventListener('pointercancel',()=>{dockDrag=null;dock.classList.remove('dragging');dock.style.setProperty('--i',dockPages.indexOf(page));});

const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)');
function animateContent(el){if(reduceMotion.matches||!el.animate)return;el.animate([{opacity:.35,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.22,.7,.22,1)'})}
function setSheetExpanded(value){const sheet=$('#modal');sheet.classList.toggle('expanded',value);sheet.style.transform='';sheet.querySelectorAll('[data-action="sheet-toggle"]').forEach(b=>{b.setAttribute('aria-expanded',String(value));b.setAttribute('aria-label',value?'Свернуть окно':'Развернуть окно')});$('.sheet-size-button').innerHTML=icon(value?'collapse':'expand')}
let pressedButton=null;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;pressedButton=b;b.classList.add('press-on')},{passive:true});
function releasePress(){const b=pressedButton;pressedButton=null;if(b)setTimeout(()=>b.classList.remove('press-on'),80)}
document.addEventListener('pointerup',releasePress,{passive:true});document.addEventListener('pointercancel',releasePress,{passive:true});
document.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.matches('button'))e.target.classList.add('press-on')});
document.addEventListener('keyup',e=>{if(e.target.matches('button'))setTimeout(()=>e.target.classList.remove('press-on'),80)});
let scrollQueued=false,lastScrollY=window.scrollY;
window.addEventListener('scroll',()=>{if(scrollQueued)return;scrollQueued=true;requestAnimationFrame(()=>{scrollQueued=false;const y=window.scrollY,d=y-lastScrollY;if(y<48)$('#chrome').classList.remove('min');else if(Math.abs(d)>7){$('#chrome').classList.toggle('min',y>80&&d>0)}lastScrollY=y})},{passive:true});
const sheetHeader=$('.modal-head');let sheetDrag=null,suppressSheetClickUntil=0;
sheetHeader.addEventListener('pointerdown',e=>{if(e.button!==0)return;const b=e.target.closest('button');if(b&&!b.classList.contains('sheet-handle'))return;sheetDrag={id:e.pointerId,y:e.clientY,start:e.timeStamp,lastY:e.clientY,lastTime:e.timeStamp,velocity:0,delta:0,moved:false};});
sheetHeader.addEventListener('pointermove',e=>{if(!sheetDrag||e.pointerId!==sheetDrag.id)return;const d=e.clientY-sheetDrag.y;sheetDrag.delta=d;if(Math.abs(d)>6||sheetDrag.moved){sheetDrag.moved=true;if(!sheetHeader.hasPointerCapture(e.pointerId))sheetHeader.setPointerCapture(e.pointerId);sheetDrag.velocity=(e.clientY-sheetDrag.lastY)/Math.max(1,e.timeStamp-sheetDrag.lastTime);sheetDrag.lastY=e.clientY;sheetDrag.lastTime=e.timeStamp;$('#modal').style.transform='translateY('+(d<0?d*.12:d)+'px)'}});
function finishSheetDrag(e,cancelled=false){if(!sheetDrag)return;const d=sheetDrag;sheetDrag=null;$('#modal').style.transform='';if(!d.moved)return;suppressSheetClickUntil=Date.now()+250;if(cancelled)return;const sheet=$('#modal');if(d.delta < -40)setSheetExpanded(true);else if(d.delta>55&&sheet.classList.contains('expanded'))setSheetExpanded(false);else if(d.delta>90||(d.delta>25&&d.velocity>.55))close();else if(!reduceMotion.matches&&sheet.animate)sheet.animate([{transform:'translateY('+Math.max(0,d.delta)+'px)'},{transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.22,.7,.22,1)'});}
sheetHeader.addEventListener('pointerup',e=>finishSheetDrag(e));sheetHeader.addEventListener('pointercancel',e=>finishSheetDrag(e,true));
sheetHeader.addEventListener('click',e=>{if(Date.now()<suppressSheetClickUntil){e.preventDefault();e.stopPropagation()}},true);
$('#modal').addEventListener('close',()=>{sheetDrag=null;setSheetExpanded(false)});

save();render();
</script>
</body>
</html>
